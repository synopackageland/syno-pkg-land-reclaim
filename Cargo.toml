[package]
name = "syno-reclaim"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Synology/Btrfs reclaimable-space analysis CLI"
license = "Apache-2.0"
publish = false

[[bin]]
name = "synoreclaim"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

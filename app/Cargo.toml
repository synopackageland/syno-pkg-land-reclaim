[package]
name = "synoreclaim-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Syno Reclaim's App behind the SDK's Go runtime; root work goes to the executor"

[[bin]]
name = "synoreclaim-app"
path = "src/main.rs"

[dependencies]
syno-pkg-land-app = { git = "https://github.com/synopackageland/syno-pkg-land-sdk", tag = "v0.53.49" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
